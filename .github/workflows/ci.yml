name: CI

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]

# Cancel superseded runs on the same ref, so a quick follow-up push does not
# wait behind an already-stale one.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm check

            - name: Build
              run: pnpm build

            # The browser test project drives a real Chromium via Playwright.
            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Test
              run: pnpm test
