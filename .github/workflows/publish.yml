# Dormant until a version tag is pushed. Nothing publishes on ordinary pushes
# or PRs: the workflow only runs for a `vX.Y.Z` tag. To cut a release, bump the
# version and push a matching tag.
#
# Authentication is `NPM_TOKEN`, and it has to be a classic Automation token.
# That is the one kind npm exempts from 2FA, which a runner cannot answer, and
# the one kind with no expiry to outlive. A granular token gets as far as the
# registry and is turned away with EOTP; an expired one is refused with a 404
# on the PUT, which reads like a missing package.
#
# This is the same shape sv5ui publishes with, which is the reason to keep it.

name: Publish to npm

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Lets npm attach build provenance to the published package.
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            # Guard against a tag that does not match package.json, so a
            # mistyped tag cannot publish the wrong version.
            - name: Verify tag matches package version
              run: |
                  PKG=$(node -p "require('./package.json').version")
                  TAG=${GITHUB_REF_NAME#v}
                  if [ "$PKG" != "$TAG" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package version $PKG"
                      exit 1
                  fi

            - name: Build package
              run: pnpm run build

            - name: Publish to npm
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
