# Dormant until a version tag is pushed. Nothing publishes on ordinary pushes
# or PRs: the workflow only runs for a `vX.Y.Z` tag. To cut a release, bump the
# version and push a matching tag.
#
# Authentication is npm trusted publishing, so there is no token here to expire
# or leak. npm mints a short-lived credential from the OIDC identity GitHub
# issues to this workflow, which is why `id-token: write` is not optional.
#
# It needs a trusted publisher registered on npmjs.com against the package,
# naming this repository and this file by name. What the registry checks is
# the pair, so renaming this file breaks publishing until the entry is renamed
# with it.
#
# Requires the repo to be public, as npm provenance does, and npm 11.5.1 or
# newer, which is why npm is upgraded below rather than taken from Node.
name: Publish to npm

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # The credential itself: npm exchanges this OIDC token for a
            # short-lived publish token, and attaches provenance from it.
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            # No `registry-url`, deliberately. It writes an .npmrc holding
            # `_authToken=${NODE_AUTH_TOKEN}` and sets that variable to a
            # placeholder when no token is given, so npm finds a credential,
            # never reaches for the OIDC exchange, and sends the placeholder to
            # the registry, which refuses it. registry.npmjs.org is the default
            # anyway.
            - uses: actions/setup-node@v6
              with:
                  # Trusted publishing wants 22.14.0 or newer; 22 resolves
                  # above that and keeps the runner on the current patch.
                  node-version: 22
                  cache: pnpm

            # Node 22 ships npm 10, which has no idea what an OIDC exchange is
            # and would fall back to looking for a token that is not here.
            - name: Use an npm that can talk to a trusted publisher
              run: npm install -g npm@^11.5.1

            - run: pnpm install --frozen-lockfile

            # Guard against a tag that does not match package.json, so a
            # mistyped tag cannot publish the wrong version.
            - name: Verify tag matches package version
              run: |
                  PKG=$(node -p "require('./package.json').version")
                  TAG=${GITHUB_REF_NAME#v}
                  if [ "$PKG" != "$TAG" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package version $PKG"
                      exit 1
                  fi

            - name: Build package
              run: pnpm run build

            # No token and no --provenance: the credential comes from the OIDC
            # exchange, and provenance is attached without being asked for.
            #
            # The two versions are printed because both have been the answer
            # once: npm below 11.5.1 does not know how to make the exchange,
            # and a job without the OIDC request URL has nothing to make it
            # with. The URL is a capability, not a secret; the token it issues
            # is never printed.
            - name: Publish to npm
              run: |
                  echo "npm $(npm --version), node $(node --version)"
                  echo "OIDC available: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
                  npm publish --access public
