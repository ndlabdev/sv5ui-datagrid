# Dormant until a version tag is pushed. Nothing publishes on ordinary pushes
# or PRs: the workflow only runs for a `vX.Y.Z` tag. To cut a release, bump the
# version and push a matching tag.
#
# Authentication is `NPM_TOKEN`, a granular access token that has to be made
# with two things npm leaves off by default: "Bypass two-factor
# authentication", since a runner cannot answer an OTP prompt, and read and
# write on this package, since the permission starts at no access. Without the
# first npm refuses with EOTP; without the second, or once the token's expiry
# passes, it refuses with a 404 on the PUT, which reads like a missing package.
#
# Granular tokens expire. Whoever renews this will meet the same two boxes.
#
# This is the same shape sv5ui publishes with, which is the reason to keep it.

name: Publish to npm

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Lets npm attach build provenance to the published package.
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install --frozen-lockfile

            # Guard against a tag that does not match package.json, so a
            # mistyped tag cannot publish the wrong version.
            - name: Verify tag matches package version
              run: |
                  PKG=$(node -p "require('./package.json').version")
                  TAG=${GITHUB_REF_NAME#v}
                  if [ "$PKG" != "$TAG" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package version $PKG"
                      exit 1
                  fi

            - name: Build package
              run: pnpm run build

            - name: Publish to npm
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
